# Both services build from the repository root so that the executed experiment
# and screening artifacts they read at runtime are inside the build context.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    environment:
      PHYTOTRUTH_MODEL_DIR: /app/experiments/ml_activity_chembl335
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["4173:80"]
    depends_on: [api]
